<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Malg</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b1210">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="bg-glow"></div>

  <main class="auth-shell">
    <div class="brand">
      <div class="brand-mark">M</div>
      <h1>Malg</h1>
      <p class="tagline">دردشتك، على راحتك.</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" data-tab="login">دخول</button>
        <button class="tab" data-tab="signup">حساب جديد</button>
      </div>

      <!-- ===== تسجيل الدخول ===== -->
      <form id="loginForm" class="form active">
        <label>
          <span>رقم الهاتف</span>
          <input type="tel" id="loginPhone" placeholder="01xxxxxxxxx" required autocomplete="tel">
        </label>
        <label>
          <span>كلمة السر</span>
          <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn-primary">دخول</button>
        <button type="button" class="link-btn" id="forgotBtn">نسيت كلمة السر؟</button>
        <p class="error" id="loginError"></p>
      </form>

      <!-- ===== حساب جديد ===== -->
      <form id="signupForm" class="form">
        <label>
          <span>الاسم</span>
          <input type="text" id="signupName" placeholder="اسمك" required autocomplete="name">
        </label>
        <label>
          <span>رقم الهاتف</span>
          <input type="tel" id="signupPhone" placeholder="01xxxxxxxxx" required autocomplete="tel">
        </label>
        <label>
          <span>كلمة السر</span>
          <input type="password" id="signupPassword" placeholder="6 أحرف على الأقل" required autocomplete="new-password">
        </label>
        <button type="submit" class="btn-primary">إنشاء حساب</button>
        <p class="error" id="signupError"></p>
      </form>
    </div>
  </main>

  <!-- ===== شاشة بعد الدخول (مؤقتة لحد ما نبني الدردشة) ===== -->
  <main class="app-shell" id="appShell" hidden>
    <header class="app-header">
      <div class="me">
        <div class="avatar" id="meAvatar">?</div>
        <div>
          <div class="me-name" id="meName">—</div>
          <div class="me-phone" id="mePhone">—</div>
        </div>
      </div>
      <button class="link-btn" id="logoutBtn">خروج</button>
    </header>
    <div class="empty-state">
      <p>تسجيل الدخول تمام ✅</p>
      <p class="dim">الدردشة والمكالمات جاية في الخطوة الجاية.</p>
    </div>
  </main>

  <!-- ===== نافذة "نسيت الباسورد" ===== -->
  <div class="modal" id="forgotModal" hidden>
    <div class="modal-box">
      <h3>نسيت كلمة السر</h3>
      <p class="dim">هيتفتح واتساب علشان تتواصل مع فريق الدعم وتستعيد حسابك.</p>
      <label>
        <span>رقم الهاتف المسجل</span>
        <input type="tel" id="forgotPhone" placeholder="01xxxxxxxxx">
      </label>
      <div class="modal-actions">
        <button class="btn-secondary" id="forgotCancel">إلغاء</button>
        <a class="btn-primary" id="forgotWhatsapp" target="_blank" rel="noopener">تواصل عبر واتساب</a>
      </div>
    </div>
  </div>

<script src="/script.js"></script>
</body>
</html>
