<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Malg</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b1210">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="bg-glow"></div>

  <!-- ===================== شاشة الدخول / حساب جديد ===================== -->
  <main class="auth-shell" id="authShell">
    <div class="brand">
      <div class="brand-mark">M</div>
      <h1>Malg</h1>
      <p class="tagline">دردشتك، على راحتك.</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" data-tab="login">دخول</button>
        <button class="tab" data-tab="signup">حساب جديد</button>
      </div>

      <form id="loginForm" class="form active">
        <label>
          <span>رقم الهاتف</span>
          <input type="tel" id="loginPhone" placeholder="01xxxxxxxxx" required autocomplete="tel">
        </label>
        <label>
          <span>كلمة السر</span>
          <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn-primary">دخول</button>
        <button type="button" class="link-btn" id="forgotBtn">نسيت كلمة السر؟</button>
        <p class="error" id="loginError"></p>
      </form>

      <form id="signupForm" class="form">
        <label>
          <span>الاسم</span>
          <input type="text" id="signupName" placeholder="اسمك" required autocomplete="name">
        </label>
        <label>
          <span>رقم الهاتف</span>
          <input type="tel" id="signupPhone" placeholder="01xxxxxxxxx" required autocomplete="tel">
        </label>
        <label>
          <span>كلمة السر</span>
          <input type="password" id="signupPassword" placeholder="6 أحرف على الأقل" required autocomplete="new-password">
        </label>
        <button type="submit" class="btn-primary">إنشاء حساب</button>
        <p class="error" id="signupError"></p>
      </form>
    </div>
  </main>

  <!-- ===================== الشاشة الرئيسية (قائمة الدردشات) ===================== -->
  <main class="app-shell" id="appShell" hidden>
    <header class="app-header">
      <div class="me">
        <div class="avatar" id="meAvatar">?</div>
        <div>
          <div class="me-name" id="meName">—</div>
          <div class="me-phone" id="mePhone">—</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="searchToggleBtn" title="بحث في الدردشات">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        </button>
        <button class="icon-btn" id="logoutBtn" title="خروج">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3H9a1 1 0 0 0-1 1v4h2V5h9v14h-9v-3H9v4a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1z"/></svg>
        </button>
      </div>
    </header>

    <div class="search-bar" id="searchBar" hidden>
      <input type="text" id="chatSearchInput" placeholder="دور في دردشاتك">
    </div>

    <section class="chat-list" id="chatList"></section>

    <div class="empty-chats" id="emptyChats">
      <div class="empty-illustration">
        <svg viewBox="0 0 120 120" width="96" height="96">
          <circle cx="60" cy="60" r="56" fill="none" stroke="var(--border)" stroke-width="2"/>
          <path fill="var(--accent-dim)" opacity="0.25" d="M35 40h50a8 8 0 0 1 8 8v22a8 8 0 0 1-8 8H55l-14 12V78H35a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8z"/>
        </svg>
      </div>
      <p>لسه معملتش أي دردشة</p>
      <p class="dim">دوس على الزرار وابحث برقم صاحبك</p>
    </div>

    <button class="fab" id="newChatFab" title="دردشة جديدة">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20.71 7.04c.39-.39.39-1.04 0-1.41l-2.34-2.34c-.37-.39-1.02-.39-1.41 0l-1.84 1.83 3.75 3.75M3 17.25V21h3.75L17.81 9.93l-3.75-3.75L3 17.25z"/></svg>
    </button>
  </main>

  <!-- ===================== نافذة دردشة جديدة (بحث بالرقم) ===================== -->
  <div class="modal sheet" id="newChatModal" hidden>
    <div class="modal-box sheet-box">
      <div class="sheet-handle"></div>
      <h3>دردشة جديدة</h3>
      <input type="tel" id="newChatSearch" placeholder="ابحث برقم الهاتف" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
      <button class="link-btn" id="newChatClose">إغلاق</button>
    </div>
  </div>

  <!-- ===================== شاشة الدردشة (محادثة فردية) ===================== -->
  <main class="chat-screen" id="chatScreen" hidden>
    <header class="chat-header">
      <button class="icon-btn" id="backBtn">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.51 3.87 15.73 2.1 5.84 12l9.9 9.9 1.77-1.77L9.38 12z"/></svg>
      </button>
      <div class="avatar" id="chatAvatar">?</div>
      <div class="chat-header-info">
        <div class="chat-name" id="chatName">—</div>
        <div class="chat-status" id="chatStatus">متصل الآن</div>
      </div>
    </header>
    <div class="messages" id="messagesList"></div>
    <form class="composer" id="composerForm">
      <input type="text" id="composerInput" placeholder="اكتب رسالة" autocomplete="off">
      <button type="submit" class="send-btn">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>
  </main>

  <!-- ===================== نافذة "نسيت الباسورد" ===================== -->
  <div class="modal" id="forgotModal" hidden>
    <div class="modal-box">
      <h3>نسيت كلمة السر</h3>
      <p class="dim">هيتفتح واتساب علشان تتواصل مع فريق الدعم وتستعيد حسابك.</p>
      <label>
        <span>رقم الهاتف المسجل</span>
        <input type="tel" id="forgotPhone" placeholder="01xxxxxxxxx">
      </label>
      <div class="modal-actions">
        <button class="btn-secondary" id="forgotCancel">إلغاء</button>
        <a class="btn-primary" id="forgotWhatsapp" target="_blank" rel="noopener">تواصل عبر واتساب</a>
      </div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="/firebase-client-config.js"></script>
<script src="/script.js"></script>
</body>
</html>
